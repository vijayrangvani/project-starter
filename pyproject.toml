# One file for project metadata, dependencies AND tool config (ruff, pytest).
# Managed with uv:  uv sync  (creates .venv, installs exact versions from uv.lock)
# Add a package:    uv add httpx        Dev-only:  uv add --dev pytest-cov
# Never edit uv.lock by hand; commit it together with pyproject.toml.

[project]
name = "app"                       # TODO: rename to your project
version = "0.1.0"
description = "TODO: one line on what this does"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pre-commit>=3.7"]   # installed by `uv sync`, not in production

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]                    # src/ layout: tests run against the INSTALLED package, not loose files

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors  I: import order  B: likely bugs  UP: modern syntax  SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
