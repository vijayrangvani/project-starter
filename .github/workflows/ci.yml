name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true           # caches downloaded packages between runs
      - run: uv sync --locked          # fails if uv.lock is missing or out of date with pyproject.toml
      - run: uv run ruff check --output-format=github .
      - name: Format check
        shell: bash
        run: |
          set +e
          uv run ruff format --diff . > fmt.diff 2>&1; code=$?
          if [ $code -ne 0 ]; then head -20 fmt.diff | sed 's/^/::error::/'; fi   # show diff on run page
          exit $code
      - run: uv run pytest
      - run: docker build -t app .
