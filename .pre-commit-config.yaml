# Runs automatically on `git commit` (after `pre-commit install`). Blocks the commit if a check fails.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0       # keep equal to ruff in uv.lock (`uv run ruff --version`)
    hooks:
      - id: ruff
        args: [--fix]           # fix what it can, fail on the rest
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]  # Kubernetes files often hold several resources separated by ---
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key  # stops you committing SSH/TLS keys
      - id: check-added-large-files
